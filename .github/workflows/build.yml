name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref: this CI is a build check, not a release gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # dsh-tray is a Windows-only .NET Framework tray application.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No Node.js step: the exe icon is the committed assets/icon-app.ico, and the
      # notification-area icon is rendered at runtime from the end user's own DSH.
      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify the executable
        shell: pwsh
        run: |
          $exe = 'dist/dsh-tray.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }

          # Guard the invariant that keeps the console window away: the PE subsystem
          # must be 2 (Windows GUI), never 3 (Console).
          $bytes = [IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          if ($subsystem -ne 2) { throw "PE subsystem is $subsystem, expected 2 (Windows GUI)" }
          Write-Host 'PE subsystem = 2 (Windows GUI): OK'

          # The build must embed this project's own artwork. If someone drops the
          # icon (or the -win32icon flag), the exe silently falls back to the generic
          # .NET icon - catch that here.
          $ico = [IO.File]::ReadAllBytes('assets/icon-app.ico')
          $entryLen = [BitConverter]::ToInt32($ico, 6 + 8)
          $entryOff = [BitConverter]::ToInt32($ico, 6 + 12)
          $slice = New-Object byte[] 64
          [Array]::Copy($ico, $entryOff + $entryLen - 64, $slice, 0, 64)
          $hexExe = [BitConverter]::ToString($bytes).Replace('-', '')
          $hexSlice = [BitConverter]::ToString($slice).Replace('-', '')
          if (-not $hexExe.Contains($hexSlice)) { throw 'assets/icon-app.ico is not embedded in the exe' }
          Write-Host 'app icon embedded: OK'

      - name: Verify the self-check contract
        shell: pwsh
        run: |
          $selftest = 'dist/selftest.txt'
          if (-not (Test-Path $selftest)) { throw 'selftest.txt was not produced' }
          Get-Content $selftest

          # These keys are the diagnostic contract; renaming one would silently break
          # every bug report that quotes them. runtimeIcon is expected to be
          # "no favicon found" on CI, which is the documented graceful fallback.
          $text = Get-Content $selftest -Raw
          foreach ($key in @('workspace', 'wsExists', 'port', 'faviconPath', 'runtimeIcon', 'urlParseTest')) {
            if ($text -notmatch [regex]::Escape($key)) { throw "self-check output is missing '$key'" }
          }
          Write-Host 'self-check output: OK'
