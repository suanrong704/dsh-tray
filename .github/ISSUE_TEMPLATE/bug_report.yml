name: Bug 报告
description: 启动失败、托盘图标不对、行为异常等
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先跑一次自检，它通常能直接回答大部分问题：

        ```powershell
        dsh-tray.exe --selftest out.txt
        ```

  - type: textarea
    id: selftest
    attributes:
      label: 自检输出
      description: 上面那条命令生成的 out.txt 内容
      render: text
    validations:
      required: true

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      description: 终端运行 dsh --version，或看 @deepseek-ai/dsh 的 package.json
      placeholder: 0.1.5-rc.2
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: how-started
    attributes:
      label: DSH 是谁启动的
      description: 这决定了「退出」会结束哪个进程，以及浏览器是否使用带 token 的地址
      options:
        - 本启动器启动的（双击 dsh-tray.exe）
        - 外部启动的（终端里 npx dsh web 等）
        - 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望行为 vs 实际行为，以及复现步骤
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 托盘右键「打开日志」，把相关部分贴上来（%LOCALAPPDATA%\DshTray\dsh-web.log）
      render: text
    validations:
      required: false
